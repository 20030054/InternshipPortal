name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose topology
        env:
          POSTGRES_PASSWORD: ci-placeholder
        run: docker compose config --quiet

      - name: Build app/worker image
        run: docker build -t scit-internship-portal:ci .

      - name: Build backup sidecar image
        run: docker build -t scit-internship-portal-backup:ci ./docker/backup
